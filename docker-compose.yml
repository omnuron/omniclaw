services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  omniclaw-agent:
    build: .
    command: uvicorn omniclaw.agent.server:app --host 0.0.0.0 --port 8080 --reload
    environment:
      - OMNICLAW_REDIS_URL=redis://redis:6379/0
      - OMNICLAW_EVENTS_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  redis-data:
